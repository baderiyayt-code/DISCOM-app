    <!-- 🔐 AUTHENTICATION SCREEN (Fixed Webview Black-Box Issue) -->
    <div id="auth-screen">
        <div class="auth-card">
            <div class="auth-logo"><i class="fa-solid fa-bolt-lightning"></i></div>
            <h2>DISCOM Survey Pro</h2>
            <p>Enterprise GIS Mapping</p>
            
            <div id="signupNameField" style="display:none;" class="form-group">
                <i class="fa-solid fa-user"></i>
                <input type="text" id="authName" class="form-input" placeholder="Full Name">
            </div>
            <div class="form-group">
                <i class="fa-solid fa-envelope"></i>
                <input type="email" id="authEmail" class="form-input" placeholder="Email Address">
            </div>
            <div class="form-group">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="authPassword" class="form-input" placeholder="Password">
            </div>

            <button class="btn-primary" id="loginBtn" onclick="handleSupabaseAuth('login')">
                <i class="fa-solid fa-right-to-bracket"></i> Login Securely
            </button>
            <button class="btn-primary" id="signupBtn" style="display:none;" onclick="handleSupabaseAuth('signup')">
                <i class="fa-solid fa-user-plus"></i> Create Account
            </button>
            
            <div class="auth-toggle" onclick="toggleAuthMode()" id="authToggleText">Need an account? Sign Up</div>
        </div>
    </div>
